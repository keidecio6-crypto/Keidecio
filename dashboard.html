.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06) 42%,rgba(255,255,255,.09));
  border:1px solid rgba(255,255,255,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -1px 0 rgba(255,255,255,.06), 0 18px 45px rgba(0,0,0,.38);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  position:relative;
  overflow:hidden;
}

.glass::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 22%,transparent 42%);
}

.glass::after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
}

.glass-row{
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.glass-row:hover{
  transform:translateY(-2px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 14px 30px rgba(124,58,237,.22);
}

.glass-row:active{
  transform:translateY(0) scale(.99);
}

.ico{
  position:relative;
  overflow:hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -6px 12px rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.25);
}

.ico::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.55),transparent 45%);
}

.ico svg{
  position:relative;
  z-index:1;
}

@keyframes drift1{
  0%{
    transform:translate(0,0) scale(1)
  }

  50%{
    transform:translate(52px,38px) scale(1.14)
  }

  100%{
    transform:translate(0,0) scale(1)
  }
}

  0%{
    transform:translate(0,0) scale(1.05)
  }

  50%{
    transform:translate(-48px,-32px) scale(.92)
  }

  100%{
    transform:translate(0,0) scale(1.05)
  }
}

@keyframes drift3{
  0%{
    transform:translate(0,0)
  }

  50%{
    transform:translate(28px,-46px) scale(1.18)
  }

  100%{
    transform:translate(0,0)
  }
}

  0%,100%{
    transform:translateY(0)

  50%{

}

  0%{
    transform:translateX(-120%)

  }
}

  0%{

  }

  }

  100%{
    transform:translateX(120%) rotate(12deg);
    opacity:0
  }
}

  content:"";
  position:absolute;
  width:110%;
  height:70%;
  left:-8%;
  top:-38%;
  background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 55%);
  transform:rotate(-4deg);
  pointer-events:none;
}

.floor{
  height:72px;
  margin:-14px 14px 0;
  border-radius:999px;
  background:radial-gradient(ellipse at center, rgba(168,85,247,.42), rgba(236,72,153,.18) 45%, transparent 72%);
  filter:blur(18px);
  opacity:.85;
  transform:scaleY(.55);
}

.light-streak{
  position:absolute;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  animation:streak 7s linear infinite;
  pointer-events:none;
}

.modal-show{
  display:flex !important;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.last\:border-0:last-child{
  border-width: 0px;
}
